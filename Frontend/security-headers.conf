# En-têtes de sécurité de l'espace client — snippet inclus dans CHAQUE location.
#
# POURQUOI UN SNIPPET ET PAS UN SIMPLE BLOC server
# nginx n'hérite PAS des `add_header` du bloc parent dès qu'un bloc enfant
# déclare les siens. Or plusieurs `location` posent ici un `add_header
# Cache-Control` : déclarer les en-têtes de sécurité au niveau `server` les
# ferait disparaître silencieusement sur ces chemins-là, CSP comprise. Le site
# vitrine avait exactement ce bug, sans que la configuration le laisse deviner.
#
# Règle : toute nouvelle `location` qui ajoute un `add_header` DOIT inclure ce
# fichier, sinon elle perd tous les en-têtes ci-dessous.
#
# HSTS n'y figure pas : il est posé en bordure par Cloudflare.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Content-Security-Policy.
#
# L'application n'en avait AUCUNE, alors que c'est elle qui porte le paiement,
# la signature de contrats et les documents clients — le site vitrine, lui, en
# avait une. C'était l'inversion la plus gênante entre les deux dépôts.
#
# Directives liées à Stripe, toutes nécessaires au fonctionnement d'Elements :
#   script-src  https://js.stripe.com   — le script Stripe.js lui-même ;
#   frame-src   https://js.stripe.com   — Elements rend les champs carte dans
#               https://hooks.stripe.com  des iframes isolées, et 3-D Secure
#                                         s'affiche depuis hooks.stripe.com ;
#   connect-src https://api.stripe.com   — appels réseau de Stripe.js.
# Retirer l'une d'elles casse le paiement de façon peu lisible : les champs
# carte n'apparaissent tout simplement pas.
#
# 'unsafe-inline' sur style-src : React pose des styles via l'attribut `style`
# (couvert par style-src-attr, qui retombe sur style-src). Le retirer
# demanderait de purger tous les `style={{...}}` des composants.
#
# script-src NE contient PAS 'unsafe-inline' : aucun script inline n'existe dans
# index.html. C'est ce qui donne sa valeur à la directive — sans cela, un script
# injecté s'exécuterait malgré la CSP.
#
# L'authentification passe par une redirection de page entière vers Authentik :
# une navigation n'est pas soumise à la CSP, aucune directive n'est requise pour
# elle.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://*.stripe.com; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; manifest-src 'self'; upgrade-insecure-requests" always;
