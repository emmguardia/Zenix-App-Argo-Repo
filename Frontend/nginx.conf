# Configuration nginx du frontend de l'espace client.
#
# Ce fichier est un TEMPLATE : au démarrage, l'entrypoint de l'image substitue
# ${NGINX_LOCAL_RESOLVERS} (rempli depuis le /etc/resolv.conf du pod) et écrit
# le résultat dans /etc/nginx/conf.d/default.conf.
#
# Le TLS est terminé en amont (Cloudflare + Traefik) : ce serveur ne parle qu'en
# HTTP en interne. HSTS, X-Frame-Options et Permissions-Policy sont posés par le
# middleware Traefik `security-headers` du chart.
#
# La Content-Security-Policy, elle, est servie ICI : Traefik n'en pose aucune, et
# l'application n'en avait donc aucune. Voir security-headers.conf, inclus dans
# chaque location.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ne pas divulguer la version de nginx dans les réponses et pages d'erreur.
    server_tokens off;

    # Résolveur DNS du cluster, injecté au démarrage.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
    resolver_timeout 5s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── API ──────────────────────────────────────────────────────────────────
    # L'hôte passe par une variable À DESSEIN.
    #
    # Avec un nom littéral (`proxy_pass http://zenix-app-backend:3000`), nginx
    # résout le DNS au CHARGEMENT de la configuration et REFUSE DE DÉMARRER si
    # le nom est introuvable. Concrètement : si le Service backend était absent
    # au démarrage du pod frontend — rolling update, incident, ordre de
    # planification — nginx ne démarrait pas du tout et TOUT l'espace client
    # devenait injoignable, pas seulement /api. Le même piège avait déjà été
    # rencontré et corrigé sur le site vitrine.
    #
    # Via une variable, la résolution a lieu par requête : si le backend est
    # absent, seul /api/ renvoie 502 et l'interface continue de répondre.
    #
    # Effet de bord d'un proxy_pass avec variable : nginx ne réécrit plus l'URI,
    # il faut donc la passer explicitement — $request_uri conserve le chemin
    # complet et la query string.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        set $zenix_app_backend "zenix-app-backend";
        proxy_pass http://$zenix_app_backend:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        client_max_body_size 20m;
    }

    # Assets fingerprintés : cache long.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # SPA : toutes les autres routes rendent index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
