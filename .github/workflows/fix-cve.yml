# « Corriger les CVE et redéployer » — déclenché À LA MAIN depuis l'onglet
# Actions de GitHub. C'est le bouton à cliquer quand un scan signale une CVE.
#
# Jumeau du workflow du même nom sur le dépôt du site vitrine. Les deux dépôts
# doivent rester alignés : c'est précisément le décalage entre les deux (npm ici
# contre pnpm là-bas, Trivy après le push ici contre avant là-bas) qui avait
# laissé l'espace client moins protégé que le site vitrine, alors que c'est lui
# qui porte les paiements, les contrats et les documents clients.
#
# CE QUE ÇA FAIT, EN UN CLIC
#   1. met à jour les dépendances npm selon la stratégie choisie ;
#   2. reconstruit les images en retéléchargeant les images de base (`--pull`),
#      ce qui récupère les correctifs Alpine et Node ;
#   3. rejoue audit, typecheck et tests ;
#   4. scanne avec Trivy AVANT toute publication ;
#   5. ne publie et ne déploie que si tout est propre.
#
# Un commit poussé par github-actions[bot] avec le GITHUB_TOKEN ne déclenche pas
# d'autre workflow (protection anti-boucle de GitHub) : le pipeline est donc
# complet ici, plutôt que de déléguer à build-and-push, ce qui aurait exigé un
# Personal Access Token à créer et à faire tourner.

name: Corriger les CVE et redéployer

on:
  workflow_dispatch:
    inputs:
      strategie:
        description: "Ampleur de la mise à jour des dépendances"
        required: true
        default: patch-et-mineur
        type: choice
        options:
          # Respecte les plages semver déclarées dans package.json.
          - patch-et-mineur
          # `pnpm update --latest` : franchit les versions majeures.
          - majeures-incluses
          # Ne touche à aucune dépendance : rebuild depuis des bases fraîches.
          - images-de-base-seules
      deployer:
        description: "Déployer si tout est propre (décocher pour un essai à blanc)"
        required: true
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: aquasec/trivy:0.73.0
  PNPM_VERSION: 10.33.4
  NODE_VERSION: '22'

permissions:
  contents: read

concurrency:
  group: fix-cve-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  corriger:
    name: Corriger, tester, scanner, déployer
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── 1. Mise à jour des dépendances ──────────────────────────────────────
      # `pnpm update` respecte .npmrc, donc minimum-release-age=1440 : aucune
      # version publiée depuis moins de 24 h n'est retenue, y compris ici.
      - name: Mettre à jour les dépendances
        id: maj
        run: |
          set -euo pipefail
          STRAT="${{ inputs.strategie }}"
          if [ "$STRAT" = "images-de-base-seules" ]; then
            echo "Stratégie « images-de-base-seules » : aucune dépendance touchée."
            exit 0
          fi

          FLAGS=""
          [ "$STRAT" = "majeures-incluses" ] && FLAGS="--latest"

          for dir in Backend Frontend; do
            echo "::group::$dir — pnpm update $FLAGS"
            (cd "$dir" && pnpm install --frozen-lockfile && pnpm update $FLAGS)
            echo "::endgroup::"
          done

          if git diff --quiet -- '*/package.json' '*/pnpm-lock.yaml'; then
            echo "Aucune mise à jour disponible."
          else
            {
              echo "### Dépendances mises à jour"
              echo '```'
              git diff --stat -- '*/package.json' '*/pnpm-lock.yaml'
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
          fi

      # ── 2. Contrôles qualité et sécurité ────────────────────────────────────
      - name: Backend – install
        working-directory: Backend
        run: pnpm install --no-frozen-lockfile

      - name: Backend – audit (prod, moderate+)
        working-directory: Backend
        run: pnpm audit --prod --audit-level moderate

      - name: Backend – tests
        working-directory: Backend
        run: pnpm run --if-present test

      - name: Frontend – install
        working-directory: Frontend
        run: pnpm install --no-frozen-lockfile

      - name: Frontend – audit (prod, moderate+)
        working-directory: Frontend
        run: pnpm audit --prod --audit-level moderate

      # `build` = tsc -b && vite build : vérifie le typage en plus du bundle.
      - name: Frontend – build (typecheck + bundle)
        working-directory: Frontend
        run: pnpm run build

      # ── 3. Version et build des images ──────────────────────────────────────
      - name: Bump version
        id: tag
        run: |
          set -euo pipefail
          CONTENT=$(cat version.txt | tr -d '\r\n ')
          MAJOR=$(echo "$CONTENT" | cut -d. -f1)
          MINOR=$(echo "$CONTENT" | cut -d. -f2)
          PATCH=$(echo "$CONTENT" | cut -d. -f3)
          if ! [[ "$MAJOR" =~ ^[0-9]+$ ]] || ! [[ "$MINOR" =~ ^[0-9]+$ ]] || ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "version.txt invalide: $CONTENT (attendu X.Y.Z)"; exit 1
          fi
          if [ "$PATCH" -lt 9 ]; then PATCH=$((PATCH + 1)); else PATCH=0; MINOR=$((MINOR + 1)); fi
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "$NEW_VERSION" > version.txt
          echo "tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # `pull: true` est le cœur du sujet quand la CVE vient de l'image de base :
      # sans lui, Docker réutiliserait la couche node/nginx en cache, correctifs
      # Alpine compris… c'est-à-dire non compris.
      - name: Build backend (local — pour scan Trivy)
        uses: docker/build-push-action@v7
        with:
          context: ./Backend
          load: true
          push: false
          tags: scan-app-back:latest
          pull: true
          no-cache: true

      - name: Build frontend (local — pour scan Trivy)
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          load: true
          push: false
          tags: scan-app-front:latest
          pull: true
          no-cache: true

      # ── 4. Scan Trivy AVANT publication ─────────────────────────────────────
      - name: Trivy — backend et frontend
        run: |
          set -uo pipefail
          FAIL=0
          for img in scan-app-back scan-app-front; do
            echo "::group::Trivy $img"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              ${{ env.TRIVY_IMAGE }} image --exit-code 1 --severity CRITICAL,HIGH \
              --ignore-unfixed --skip-version-check --format table \
              "$img:latest" | tee "/tmp/$img.txt" || FAIL=1
            echo "::endgroup::"
          done

          {
            echo "### Scan Trivy"
            if [ "$FAIL" = "0" ]; then
              echo "Aucune vulnérabilité CRITICAL ou HIGH corrigeable."
            else
              echo "**Vulnérabilités restantes — publication annulée.**"
              echo '```'
              grep -hE "CRITICAL|HIGH" /tmp/scan-app-*.txt | head -40 || true
              echo '```'
              echo "Relancez en « majeures-incluses » si le correctif exige une version majeure."
            fi
          } >> $GITHUB_STEP_SUMMARY

          exit "$FAIL"

      # ── 5. Publication et déploiement ───────────────────────────────────────
      - name: Log in to GHCR
        if: ${{ inputs.deployer }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend
        if: ${{ inputs.deployer }}
        id: push-backend
        uses: docker/build-push-action@v7
        with:
          context: ./Backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/zenix-app-back:${{ steps.tag.outputs.tag }}
          pull: true

      - name: Push frontend
        if: ${{ inputs.deployer }}
        id: push-frontend
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/zenix-app-front:${{ steps.tag.outputs.tag }}
          pull: true

      # Le pin du digest est ce qu'ArgoCD observe : c'est cette étape, et pas le
      # push GHCR, qui déclenche réellement le déploiement.
      - name: Pin digest + commit
        if: ${{ inputs.deployer }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          REG="${{ env.REGISTRY }}"; OWNER="${{ github.repository_owner }}"
          DB="${{ steps.push-backend.outputs.digest }}"
          DF="${{ steps.push-frontend.outputs.digest }}"

          BACKEND_IMAGE="${REG}/${OWNER}/zenix-app-back@${DB:-}"
          [ -z "${DB:-}" ] && BACKEND_IMAGE="${REG}/${OWNER}/zenix-app-back:${TAG}"
          FRONTEND_IMAGE="${REG}/${OWNER}/zenix-app-front@${DF:-}"
          [ -z "${DF:-}" ] && FRONTEND_IMAGE="${REG}/${OWNER}/zenix-app-front:${TAG}"

          VALUES_PATH="charts/zenix-app/values.yaml"
          CHART_PATH="charts/zenix-app/Chart.yaml"
          sed -i "s|  image: ghcr.io/.*zenix-app-back.*|  image: ${BACKEND_IMAGE}|" "$VALUES_PATH"
          sed -i "s|  image: ghcr.io/.*zenix-app-front.*|  image: ${FRONTEND_IMAGE}|" "$VALUES_PATH"
          sed -i "s|^appVersion:.*|appVersion: \"${TAG#v}\"|" "$CHART_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt "$VALUES_PATH" "$CHART_PATH" \
                  Backend/package.json Backend/pnpm-lock.yaml \
                  Frontend/package.json Frontend/pnpm-lock.yaml 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "Rien à commiter."
          else
            git commit -m "fix(sécurité): correction CVE et rebuild $TAG [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi

          {
            echo "### Déploiement"
            echo "- Version : \`$TAG\`"
            echo "- Backend : \`$BACKEND_IMAGE\`"
            echo "- Frontend : \`$FRONTEND_IMAGE\`"
            echo ""
            echo "ArgoCD synchronise le cluster dans les minutes qui suivent."
          } >> $GITHUB_STEP_SUMMARY

      - name: Essai à blanc — rien n'a été publié
        if: ${{ !inputs.deployer }}
        run: |
          {
            echo "### Essai à blanc"
            echo "Tests et scan Trivy passés. Aucune image publiée, aucun déploiement."
            echo "Relancez avec « deployer » coché pour appliquer."
          } >> $GITHUB_STEP_SUMMARY
