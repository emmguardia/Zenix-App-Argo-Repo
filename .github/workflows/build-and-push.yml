# Build & push : main -> tests + scan Trivy + push GHCR + pin digest dans values.yaml
# ArgoCD reprend ensuite le relai et déploie sur le cluster (namespace zenix-app).
#
# Deux corrections importantes par rapport à la version précédente :
#
#   1. pnpm au lieu de npm. `npm ci` exécute les scripts d'installation de TOUTES
#      les dépendances — le vecteur de compromission supply-chain le plus courant,
#      sur le service qui détient en runtime la clé secrète Stripe, les
#      identifiants R2, le mot de passe de la base et le SESSION_SECRET.
#      Les fichiers .npmrc portent désormais `ignore-scripts=true` et
#      `minimum-release-age=1440`, comme sur le dépôt du site vitrine.
#
#   2. Trivy scanne AVANT le push. L'ordre précédent était build → push → scan :
#      l'image vulnérable était déjà publiée sur GHCR quand le scan échouait.
#      On construit maintenant en local, on scanne, et on ne pousse que si le
#      scan est propre — comme le fait déjà le dépôt du site vitrine, et comme
#      SECURITY.md le décrit.

name: Build and push to GHCR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: aquasec/trivy:0.73.0
  PNPM_VERSION: 10.33.4
  NODE_VERSION: '22'

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: build-and-push-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            Backend/pnpm-lock.yaml
            Frontend/pnpm-lock.yaml

      - name: Backend – install
        working-directory: Backend
        run: pnpm install --frozen-lockfile

      # Restreint aux dépendances de production : les dépendances de dev ne
      # partent pas en production, une CVE qui les concerne ne doit pas bloquer
      # un déploiement. Le seuil reste `moderate`, plus strict que le site
      # vitrine, parce que ce service manipule paiements et documents clients.
      - name: Backend – audit (prod, moderate+)
        working-directory: Backend
        run: pnpm audit --prod --audit-level moderate

      - name: Backend – test
        working-directory: Backend
        run: pnpm run --if-present test

      - name: Frontend – install
        working-directory: Frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend – audit (prod, moderate+)
        working-directory: Frontend
        run: pnpm audit --prod --audit-level moderate

      # `build` = tsc -b && vite build : vérifie le typage en plus du bundle.
      - name: Frontend – build (typecheck + bundle)
        working-directory: Frontend
        run: pnpm run build

  build-and-push:
    name: Build and push
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag (version bump)
        id: tag
        run: |
          CONTENT=$(cat version.txt | tr -d '\r\n ')
          MAJOR=$(echo "$CONTENT" | cut -d. -f1)
          MINOR=$(echo "$CONTENT" | cut -d. -f2)
          PATCH=$(echo "$CONTENT" | cut -d. -f3)
          if ! [[ "$MAJOR" =~ ^[0-9]+$ ]] || ! [[ "$MINOR" =~ ^[0-9]+$ ]] || ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "version.txt invalide: $CONTENT (attendu X.Y.Z)"
            exit 1
          fi
          if [ "$PATCH" -lt 9 ]; then
            PATCH=$((PATCH + 1))
          else
            PATCH=0
            MINOR=$((MINOR + 1))
          fi
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "$NEW_VERSION" > version.txt
          TAG="v${NEW_VERSION}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── Backend ──────────────────────────────────────────────────────────────
      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/zenix-app-back
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}

      # Étape 1 : build local, sans push, pour pouvoir scanner avant publication.
      - name: Build backend (local — pour scan Trivy)
        uses: docker/build-push-action@v7
        with:
          context: ./Backend
          load: true
          push: false
          tags: scan-app-back:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true

      # Étape 2 : scan AVANT push — une image vulnérable ne part jamais sur GHCR.
      - name: Trivy scan backend (avant push)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ env.TRIVY_IMAGE }} image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
            --skip-version-check --format table \
            scan-app-back:latest

      # Étape 3 : push uniquement si le scan est propre.
      - name: Push backend
        id: build-backend
        uses: docker/build-push-action@v7
        with:
          context: ./Backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          pull: true

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/zenix-app-front
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}

      - name: Build frontend (local — pour scan Trivy)
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          load: true
          push: false
          tags: scan-app-front:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true

      - name: Trivy scan frontend (avant push)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ env.TRIVY_IMAGE }} image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
            --skip-version-check --format table \
            scan-app-front:latest

      - name: Push frontend
        id: build-frontend
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          pull: true

      # ── Pin digest dans values.yaml → ArgoCD détecte et déploie ──────────────
      - name: Pin Helm values to image digest
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          DIGEST_BACKEND="${{ steps.build-backend.outputs.digest }}"
          DIGEST_FRONTEND="${{ steps.build-frontend.outputs.digest }}"
          OWNER="${{ github.repository_owner }}"
          REG="${{ env.REGISTRY }}"

          if [ -n "$DIGEST_BACKEND" ]; then
            BACKEND_IMAGE="${REG}/${OWNER}/zenix-app-back@${DIGEST_BACKEND}"
          else
            BACKEND_IMAGE="${REG}/${OWNER}/zenix-app-back:${TAG}"
          fi
          if [ -n "$DIGEST_FRONTEND" ]; then
            FRONTEND_IMAGE="${REG}/${OWNER}/zenix-app-front@${DIGEST_FRONTEND}"
          else
            FRONTEND_IMAGE="${REG}/${OWNER}/zenix-app-front:${TAG}"
          fi

          VALUES_PATH="charts/zenix-app/values.yaml"
          sed -i "s|  image: ghcr.io/.*zenix-app-back.*|  image: ${BACKEND_IMAGE}|" "$VALUES_PATH"
          sed -i "s|  image: ghcr.io/.*zenix-app-front.*|  image: ${FRONTEND_IMAGE}|" "$VALUES_PATH"

          # appVersion du chart aligné sur la version applicative
          CHART_PATH="charts/zenix-app/Chart.yaml"
          sed -i "s|^appVersion:.*|appVersion: \"${TAG#v}\"|" "$CHART_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt "$VALUES_PATH" "$CHART_PATH"

          if git diff --staged --quiet; then
            echo "Helm values already up to date, skip commit"
          else
            git commit -m "chore(helm): pin images to digest $TAG [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi
