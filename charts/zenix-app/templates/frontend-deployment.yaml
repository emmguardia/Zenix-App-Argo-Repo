apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenix-app-frontend
  namespace: {{ include "zenix-app.namespace" . }}
  labels:
    {{- include "zenix-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.frontend.strategy.rollingUpdate.maxSurge | default 1 }}
      maxUnavailable: {{ .Values.frontend.strategy.rollingUpdate.maxUnavailable | default 0 }}
  selector:
    matchLabels:
      app: zenix-app-frontend
  template:
    metadata:
      labels:
        app: zenix-app-frontend
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # uid/gid 101 = l'utilisateur `nginx` de l'image nginx-unprivileged.
        # Déclarés explicitement plutôt que laissés à l'image : c'est ce que
        # `fsGroup` doit refléter, et un changement d'image ne doit pas
        # désaligner les deux en silence.
        runAsUser: 101
        runAsGroup: 101
        # INDISPENSABLE avec les emptyDir montés plus bas.
        # Sans fsGroup, kubelet crée le volume en root:root sans droit
        # d'écriture pour le groupe : l'entrypoint, qui tourne en uid 101, ne
        # peut pas y écrire le default.conf rendu. nginx démarre alors SANS
        # aucun bloc `server` — le conteneur paraît sain (workers lancés, aucune
        # erreur au démarrage) mais n'écoute sur rien, et les probes échouent.
        # Avec fsGroup, kubelet chown le volume sur ce groupe et le rend
        # inscriptible.
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frontend
        image: {{ .Values.frontend.image }}
        imagePullPolicy: {{ .Values.frontend.imagePullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        # Nom PLEINEMENT QUALIFIÉ du service backend, substitué dans le template
        # nginx au démarrage par l'entrypoint de l'image.
        #
        # Le nom court « zenix-app-backend » ne suffit PAS. Quand proxy_pass
        # utilise une variable, nginx résout le nom lui-même via son `resolver`
        # — et ce résolveur, contrairement à celui du système, n'applique pas les
        # domaines de recherche de /etc/resolv.conf. Un nom court échoue donc en
        # « Host not found », et toutes les requêtes /api/ repartent en 502
        # pendant que le reste du site continue de répondre.
        #
        # Passe par une variable d'environnement plutôt que d'être écrit en dur :
        # le chart se déploie aussi dans zenix-app-dev, où le FQDN diffère.
        - name: BACKEND_HOST
          value: zenix-app-backend.{{ include "zenix-app.namespace" . }}.svc.cluster.local
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        # /etc/nginx/conf.d doit être INSCRIPTIBLE, alors que la racine du
        # conteneur est en lecture seule (readOnlyRootFilesystem: true, à
        # conserver).
        #
        # La configuration nginx est un template : l'entrypoint de l'image y
        # substitue ${NGINX_LOCAL_RESOLVERS} au démarrage et écrit le résultat
        # dans /etc/nginx/conf.d/default.conf. Sans ce volume, l'écriture
        # échoue et le pod part en CrashLoopBackOff :
        #   20-envsubst-on-templates.sh: can't create
        #   /etc/nginx/conf.d/default.conf: Read-only file system
        #
        # Un emptyDir masque le contenu du dossier dans l'image — sans
        # conséquence ici : le Dockerfile supprime justement le default.conf
        # d'origine, et le template vit dans /etc/nginx/templates/.
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
        ports:
        - containerPort: {{ .Values.frontend.port }}
        resources:
          {{- toYaml .Values.frontend.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.frontend.port }}
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.frontend.port }}
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: tmp
        emptyDir: {}
      # Reçoit le default.conf rendu par l'entrypoint au démarrage. Quelques
      # kilo-octets, recréé à chaque démarrage du pod.
      - name: nginx-conf
        emptyDir: {}
